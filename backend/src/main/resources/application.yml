server:
  port: 8080

spring:
  application:
    name: sacco-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cbs
    username: cbs_app
    password: cbs_demo_password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: "cbs-general-demo-secret-key-change-me-in-production-0123456789abcdef"
    expiration-ms: 86400000

logging:
  level:
    org.hibernate.SQL: warn
    com.cbs.sacco: info